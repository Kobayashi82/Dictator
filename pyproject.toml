[project]
name = "dictador"
version = "1.0.0"
description = "Dictador: dictado por voz a un documento con Parakeet y corrección por LLM local"
readme = "README.md"
authors = [
    { name = "Kobayashi82", email = "Kobayashi82@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "onnx-asr[cpu,hub]>=0.12.0",
    "openai>=3.35.1",
    "pyside6-essentials>=6.12.0",
    "python-docx>=1.2.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
dictador = "dictador.app:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
